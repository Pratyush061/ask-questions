<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Hand Ninja — slice fruit with your hand</title>
  <meta name="description" content="Zen fruit slicing: your webcam tracks your hand and the edge of your hand is the blade. Cut falling fruit, chase combos, catch golden fruit." />
  <meta name="theme-color" content="#07090f" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍉</text></svg>" />

  <!-- Start the big downloads before any JS runs -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://storage.googleapis.com" crossorigin />
  <link rel="preload" as="fetch" crossorigin="anonymous"
        href="https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="hud">
    <div class="hud-group">
      <span class="chip score" id="score">0</span>
      <span class="chip" id="cuts">0 cut</span>
      <span class="chip" id="best">Best 0</span>
    </div>
    <span class="chip logo">🥷 Hand Ninja</span>
    <div class="hud-group">
      <button class="chip btn" id="muteBtn" title="Toggle sound">🔊</button>
      <button class="chip btn" id="resetBtn" title="Reset score">↺</button>
    </div>
  </header>

  <main id="wrap">
    <div id="stage">
      <video id="cam" playsinline muted></video>
      <canvas id="overlay"></canvas>

      <button id="startBtn">
        <span class="big">🍉</span>
        <span>Start camera</span>
      </button>
      <p id="status"></p>

      <div id="loading" class="hidden">
        <div class="spinner"></div>
        <p id="loadMsg">Loading…</p>
      </div>
    </div>

    <p id="hint" class="hidden">Chop with the <strong>edge of your hand</strong> ✋ — no timer, no losing, just zen. Golden fruit = 50 points.</p>
  </main>

  <footer>Hand tracking runs entirely in your browser · built with MediaPipe</footer>

  <script type="module" src="game.js"></script>
</body>
</html>
